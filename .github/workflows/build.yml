name: Build Sindh Scholars Quiz APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sindh-Scholars-Quiz-Android-Upgrade-v2.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          unzip -q Sindh-Scholars-Quiz-Android-Upgrade-v2.zip -d /tmp/quiz

          APP_DIR="$(find /tmp/quiz -type f -path '*/app/build.gradle*' \
            -printf '%h\n' | head -n 1)"

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Could not find the Android app module in the ZIP."
            find /tmp/quiz -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$APP_DIR")"

          cp -a "$APP_DIR" .
          cp "$PROJECT_DIR/build.gradle" . 2>/dev/null || true
          cp "$PROJECT_DIR/gradle.properties" . 2>/dev/null || true

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SindhScholarsQuiz"
          include(":app")
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build APK
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Sindh-Scholars-Quiz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
