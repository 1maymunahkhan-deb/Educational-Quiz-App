
name: Build Educational Quiz APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Educational-Quiz-WebView-Android.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q Educational-Quiz-WebView-Android.zip -d /tmp/quiz
          cp -a /tmp/quiz/Educational-Quiz-WebView-Android/app .
          cp /tmp/quiz/Educational-Quiz-WebView-Android/build.gradle .
          cp /tmp/quiz/Educational-Quiz-WebView-Android/gradle.properties .
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EducationalQuizApp"
          include(":app")
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Educational-Quiz-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
